<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmoSense AI Chat</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        :root {
            --bg-color: #0f172a;
            --chat-bg: rgba(30, 41, 59, 0.7);
            --user-msg: linear-gradient(135deg, #3b82f6, #2563eb);
            --ai-msg: rgba(51, 65, 85, 0.8);
            --accent: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg-color);
            background-image: radial-gradient(circle at top right, rgba(59, 130, 246, 0.15), transparent 40%),
                              radial-gradient(circle at bottom left, rgba(168, 85, 247, 0.15), transparent 40%);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: var(--chat-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .header {
            padding: 20px 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.2);
            transform: translateY(-1px);
        }

        .chat-box {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        /* Scrollbar styles */
        .chat-box::-webkit-scrollbar { width: 6px; }
        .chat-box::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

        .message-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 80%;
            animation: fadeIn 0.3s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-wrapper.user {
            align-self: flex-end;
            align-items: flex-end;
        }

        .message-wrapper.ai {
            align-self: flex-start;
            align-items: flex-start;
        }

        .message {
            padding: 14px 20px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.5;
            position: relative;
        }

        .message-wrapper.user .message {
            background: var(--user-msg);
            border-bottom-right-radius: 4px;
        }

        .message-wrapper.ai .message {
            background: var(--ai-msg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom-left-radius: 4px;
        }

        .meta {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .emotion-badge {
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 500;
        }

        .feedback-btns {
            display: flex;
            gap: 4px;
        }

        .feedback-btns button {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 2px 4px;
            transition: color 0.2s;
        }

        .feedback-btns button:hover {
            color: var(--text-main);
        }

        .input-area {
            padding: 20px 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .input-area input {
            flex: 1;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 16px 20px;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
            font-family: inherit;
        }

        .input-area input:focus {
            border-color: var(--accent);
        }

        .btn-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            transition: all 0.2s ease;
        }

        .btn-mic {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-mic.recording {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border-color: rgba(239, 68, 68, 0.5);
            animation: pulse 1.5s infinite;
        }

        .btn-send {
            background: var(--accent);
            color: white;
        }

        .btn-send:hover, .btn-mic:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .typing-indicator {
            display: none;
            padding: 14px 20px;
            background: var(--ai-msg);
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            align-self: flex-start;
            width: fit-content;
            gap: 4px;
            margin-bottom: 20px;
        }
        
        .typing-indicator span {
            width: 6px;
            height: 6px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="header">
            <h1>✨ EmoSense AI</h1>
            <button class="btn-danger" onclick="deleteMemory()">🗑️ Wipe Memory</button>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="message-wrapper ai">
                <div class="message">Hi there! I am EmoSense, your emotionally intelligent assistant. How are you feeling today?</div>
            </div>
            <div class="typing-indicator" id="typingIndicator">
                <span></span><span></span><span></span>
            </div>
        </div>

        <div class="input-area">
            <button class="btn-icon btn-mic" id="micBtn" onclick="toggleRecording()" title="Hold to record (Mocked for demo)">🎤</button>
            <input type="text" id="msgInput" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
            <button class="btn-icon btn-send" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <script>
        const USER_ID = "demo_user_1";
        const API_URL = "http://localhost:8001";
        let isRecording = false;

        function scrollToBottom() {
            const chatBox = document.getElementById('chatBox');
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function toggleRecording() {
            const micBtn = document.getElementById('micBtn');
            isRecording = !isRecording;
            if (isRecording) {
                micBtn.classList.add('recording');
                // Mocking audio recording for the frontend demo
            } else {
                micBtn.classList.remove('recording');
                document.getElementById('msgInput').value = "I am furious right now"; // Mock transcription
            }
        }

        function appendMessage(role, text, metaData = null) {
            const chatBox = document.getElementById('chatBox');
            const indicator = document.getElementById('typingIndicator');
            
            const wrapper = document.createElement('div');
            wrapper.className = `message-wrapper ${role}`;
            
            const msgId = 'msg_' + Math.random().toString(36).substr(2, 9);
            
            let metaHTML = '';
            if (metaData) {
                if (role === 'user') {
                    // Show detected emotion on user message
                    metaHTML = `<div class="meta">
                                    <span class="emotion-badge">${metaData.emotion} ${(metaData.confidence*100).toFixed(0)}%</span>
                                </div>`;
                } else if (role === 'ai') {
                    // Show feedback on AI message
                    metaHTML = `<div class="meta">
                                    <div class="feedback-btns">
                                        <button onclick="sendFeedback('${msgId}', true)">👍</button>
                                        <button onclick="sendFeedback('${msgId}', false)">👎</button>
                                    </div>
                                </div>`;
                }
            }

            wrapper.innerHTML = `
                <div class="message">${text}</div>
                ${metaHTML}
            `;
            
            chatBox.insertBefore(wrapper, indicator);
            scrollToBottom();
            return wrapper;
        }

        async function sendMessage() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text) return;
            
            input.value = '';
            const userMsgNode = appendMessage('user', text); // Meta added after API responds
            
            // Show typing
            const indicator = document.getElementById('typingIndicator');
            indicator.style.display = 'flex';
            scrollToBottom();

            try {
                const formData = new FormData();
                formData.append('user_id', USER_ID);
                formData.append('message', text);
                
                const res = await fetch(`${API_URL}/chat`, {
                    method: 'POST',
                    body: formData
                });
                
                const data = await res.json();
                
                // Update User message with detected emotion
                const metaDiv = document.createElement('div');
                metaDiv.className = 'meta';
                metaDiv.innerHTML = `<span class="emotion-badge">Detected: ${data.emotion} ${(data.confidence*100).toFixed(0)}%</span>`;
                userMsgNode.appendChild(metaDiv);

                // Hide typing, show AI response
                indicator.style.display = 'none';
                appendMessage('ai', data.reply, { showFeedback: true });

            } catch (err) {
                indicator.style.display = 'none';
                appendMessage('ai', 'Error connecting to the backend server. Is it running on port 8001?');
            }
        }

        async function sendFeedback(msgId, isUpvote) {
            try {
                await fetch(`${API_URL}/feedback`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        user_id: USER_ID,
                        message_id: msgId,
                        thumbs_up: isUpvote
                    })
                });
                alert('Feedback recorded!');
            } catch (err) {
                console.error(err);
            }
        }

        async function deleteMemory() {
            if (confirm("Are you sure you want to wipe all your learned memory and chat history?")) {
                try {
                    await fetch(`${API_URL}/memory/${USER_ID}`, { method: 'DELETE' });
                    document.getElementById('chatBox').innerHTML = `
                        <div class="message-wrapper ai">
                            <div class="message">Memory wiped! Let's start fresh. How are you feeling?</div>
                        </div>
                        <div class="typing-indicator" id="typingIndicator">
                            <span></span><span></span><span></span>
                        </div>
                    `;
                } catch (err) {
                    alert("Error wiping memory.");
                }
            }
        }
    </script>
</body>
</html>
